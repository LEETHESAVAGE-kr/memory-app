<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>암기장 캐시 초기화</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;padding:24px;line-height:1.7;background:#f5f5f5;color:#111}.box{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;max-width:600px;margin:auto}button,a{display:inline-block;border:0;background:#111827;color:#fff;border-radius:10px;padding:12px 14px;font-weight:900;text-decoration:none}</style></head><body><div class="box"><h2>암기장 캐시 초기화</h2><p>기존 Safari 홈 화면 앱에 남아 있는 service worker와 캐시를 삭제합니다. 완료 후 자동으로 v9 화면으로 이동합니다.</p><p id="status">진행 중...</p><p><a id="go" href="./index.html?v=9">v9 암기장 열기</a></p></div><script>(async()=>{try{if(window.caches){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}if(navigator.serviceWorker){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}document.getElementById('status').textContent='완료되었습니다. v9 암기장으로 이동합니다.';setTimeout(()=>location.href='./index.html?v=9&t='+Date.now(),800);}catch(e){document.getElementById('status').textContent='자동 초기화 중 오류가 있었습니다. 아래 버튼으로 v9를 열어주세요.';}})();</script></body></html>
